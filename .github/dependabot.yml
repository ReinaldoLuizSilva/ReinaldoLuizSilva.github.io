# Weekly dependency updates. Minor and patch bumps are grouped into a single PR
# per ecosystem; majors come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
