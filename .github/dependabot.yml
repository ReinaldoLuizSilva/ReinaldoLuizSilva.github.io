# Weekly dependency updates. Minor and patch bumps are grouped into a single PR
# per ecosystem; majors come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check and typescript-eslint only accept TypeScript <6.1 (peer
      # dependency), so any newer TypeScript breaks `npm ci`. Remove this rule once
      # both support it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
