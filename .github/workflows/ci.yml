# Quality gate for every pull request and push.
# deploy.yml only publishes a commit after this workflow succeeds on main.
name: CI

on:
  pull_request:
  push:

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; jobs ask for more only if they need it.
permissions:
  contents: read

jobs:
  verify:
    name: Check, build, links and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 1. Static checks: types, lint and formatting.
      - name: Type check (astro check)
        run: npm run check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      # 2. Build the static site into dist/.
      - name: Build
        run: npm run build

      # 3. Broken links in the generated HTML (internal and external).
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir resolves root-relative links ("/en/") against dist/.
          # 999 is LinkedIn's anti-bot status; 429 is rate limiting, not a broken link.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --accept 200..=299,429,999
            './dist/**/*.html'
          fail: true
          # Fallback token avoids GitHub API rate limits on github.com links.
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Lighthouse (mobile) with the thresholds from lighthouserc.json.
      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
